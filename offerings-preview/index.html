<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="法楽寺 授与品の横スクロール技術検証（仮カード・本番未反映）">
  <title>法楽寺｜授与品 横スクロール技術確認</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./slider.js" defer></script>
</head>
<body>
  <section class="offerings" aria-labelledby="offerings-heading">
    <div class="heading">
      <div>
        <h2 id="offerings-heading">授与品のご案内</h2>
        <p class="subtitle">横にスワイプ・矢印でご覧いただけます</p>
      </div>
      <div class="navigation" aria-label="授与品の横送り">
        <button id="offerings-prev" type="button" aria-label="前の授与品へ">‹</button>
        <button id="offerings-next" type="button" aria-label="次の授与品へ">›</button>
      </div>
    </div>
    <div id="offerings-track" class="track" tabindex="0" role="region" aria-label="授与品の横スクロール一覧">
      <article class="item">
        <div class="image-placeholder"><span class="placeholder-label">仮画像・未掲載</span><span class="placeholder-icon" aria-hidden="true">御守</span></div>
        <h3>御守り</h3><p>実物写真と紹介文は準備中</p>
      </article>
      <article class="item">
        <div class="image-placeholder"><span class="placeholder-label">仮画像・未掲載</span><span class="placeholder-icon" aria-hidden="true">御朱印</span></div>
        <h3>御朱印</h3><p>実物写真と紹介文は準備中</p>
      </article>
      <article class="item">
        <div class="image-placeholder"><span class="placeholder-label">仮画像・未掲載</span><span class="placeholder-icon" aria-hidden="true">授与品</span></div>
        <h3>その他の授与品</h3><p>実物写真と紹介文は準備中</p>
      </article>
    </div>
    <p class="notice">※ 横スクロールの技術確認用です。画像・名称・授与内容は未確定です。</p>
  </section>
</body>
</html>
