<script>
const slides=document.querySelectorAll('.slide');slides[0].innerHTML=slides[3].innerHTML;slides[4].innerHTML=slides[1].innerHTML;
const track=document.querySelector('.track'),viewport=document.querySelector('.viewport'),dots=[...document.querySelectorAll('.dot')],names=['御朱印','梵字キーホルダー','清め塩'],pause=document.querySelector('#pause');let position=1,timer,paused=matchMedia('(prefers-reduced-motion:reduce)').matches,busy=false,startX,startY;
function paint(animate=true){track.style.transition=animate?'':'none';track.style.transform=`translateX(${-position*(viewport.clientWidth*.92+12)}px)`;const i=(position+2)%3;document.querySelector('#label').textContent=names[i]+'　'+(i+1)+' / 3';dots.forEach((d,n)=>d.setAttribute('aria-current',n===i?'true':'false'));document.querySelectorAll('.slide').forEach((s,n)=>s.setAttribute('aria-hidden',n===position?'false':'true'))}
function schedule(){clearInterval(timer);if(!paused&&!document.hidden)timer=setInterval(()=>move(1),4000);pause.textContent=paused?'再生':'一時停止'}
function move(step){if(busy)return;busy=true;position+=step;paint();setTimeout(()=>{if(position===4)position=1;if(position===0)position=3;paint(false);busy=false},650)}
document.querySelector('#next').onclick=()=>{move(1);schedule()};document.querySelector('#prev').onclick=()=>{move(-1);schedule()};dots.forEach((d,i)=>d.onclick=()=>{if(busy)return;position=i+1;paint();schedule()});pause.onclick=()=>{paused=!paused;schedule()};document.addEventListener('visibilitychange',schedule);
viewport.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});viewport.addEventListener('pointerup',e=>{if(startX!==undefined&&Math.abs(e.clientX-startX)>40&&Math.abs(e.clientX-startX)>Math.abs(e.clientY-startY)){move(e.clientX<startX?1:-1);schedule()}startX=undefined});viewport.addEventListener('pointercancel',()=>startX=undefined);new ResizeObserver(()=>paint(false)).observe(viewport);paint(false);schedule();
</script></html>
